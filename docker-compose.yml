services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 1313:80
    volumes:
      - ./audiobooks/:/audiobooks
      - ./podcasts/:/podcasts
      - ./config/:/config
      - ./metadata/:/metadata
    environment:
      - TZ=America/Toronto
    restart: always
